title: Mohammad Ali Jesar
description: Senior Ruby on Rails engineer specializing in AI integration. Shopify and e-commerce, AI agents, RAG and MCP.
url: https://mjesar.github.io
baseurl: ""
author: Mohammad Ali Jesar
lang: en
markdown: kramdown
kramdown:
