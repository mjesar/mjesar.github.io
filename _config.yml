title: Mohammad Ali Jesar
description: Software engineer for Ruby on Rails, AI and automation. AI agents, RAG and MCP, SaaS and e-commerce.
url: https://mjesar.github.io
baseurl: ""
author: Mohammad Ali Jesar
lang: en
markdown: kramdown
kramdown:
  input: GFM
permalink: /writing/:title/
# Search engine verification tokens (meta tags in _includes/head.html). Leave empty until set.
# Google is already verified with google61916a52e42dacd9.html.
google_site_verification:
bing_site_verification:
# Google Analytics 4, loaded only after the visitor accepts the cookie banner
# (_includes/analytics.html). Production builds only (JEKYLL_ENV=production, set by the
# deploy workflow), so local `jekyll serve` sends nothing. A page can opt out with
# `no_analytics: true` in its front matter.
ga4_id: "G-HF9CFGP3C3"
# Date shown as "last updated" on /llm-info/, llms-full.txt and /.well-known/services.json.
# Change it whenever a fact, price or plan in _data/ changes.
facts_updated: 2026-10-16
plugins:
  - jekyll-sitemap
  - jekyll-feed
include:
  - .well-known
exclude:
  - README.md
  - docs
  - WEBSITE_CHECKLIST.md
  - Gemfile
  - Gemfile.lock
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
