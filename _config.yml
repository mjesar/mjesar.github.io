title: Mohammad Ali Jesar
description: Senior full-stack and AI engineer (Ruby on Rails). Shopify and e-commerce, AI agents, RAG and MCP.
url: https://mjesar.github.io
baseurl: ""
author: Mohammad Ali Jesar
lang: en
markdown: kramdown
kramdown:
  input: GFM
permalink: /writing/:title/
plugins:
  - jekyll-sitemap
exclude:
  - README.md
  - docs
  - WEBSITE_CHECKLIST.md
  - Gemfile
  - Gemfile.lock
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
