- slug: ai-discoverability
  name: AI discoverability for brands and online stores (GEO and AEO)
  for: e-commerce brands and store owners.
  summary: I audit product content, FAQs, schema.org structured data, catalog data and brand mentions, test how selected AI assistants answer defined shopper and brand questions, and fix the gaps in order of impact.
