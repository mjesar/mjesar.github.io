# Engagement pricing, all in USD. Drives the pricing table on /services/, llms.txt
# and the Offer data in the Service structured data (only rows with min get an Offer;
# max is optional, for "from" prices). `unit` is hour, month or project and sets the
# Offer's unit, so a monthly price is never read as per hour.
# The homepage pricing line and the llms.txt summary read from here too. The /services/
# meta description repeats the rates as plain text (front matter cannot use Liquid),
# so update services/index.md when a price changes.
# Every price comes from one hourly rate: monthly contracts are that rate with a discount for guaranteed hours, fixed prices
# are estimated hours times the rate plus a buffer for unknowns.
- id: hourly
  name: Hourly
  price: $45 to $60 per hour
  min: 45
  max: 60
  unit: hour
  terms: Pay only for the hours you use.
- id: project
  name: Project
  price: From $400
  min: 400
  unit: project
  terms: A fixed price, agreed before I start.
- id: part-time
  name: Part-time monthly
  price: $3,000 to $4,000 per month
  min: 3000
  max: 4000
  unit: month
  terms: 20 hours a week.
- id: full-time
  name: Full-time monthly
  price: $5,000 to $7,000 per month
  min: 5000
  max: 7000
  unit: month
  terms: 40 hours a week.
