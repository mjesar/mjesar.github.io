# AI discoverability (GEO and AEO) plans, all in USD. One store or one brand per plan.
# Drives the plan cards on /services/ai-discoverability/, the Offer data in its Service
# structured data, llms.txt, llms-full.txt, /llm-info/ and /.well-known/services.json.
# Change a price here and every one of those updates together.
# delivery is a full phrase, shown as written on the cards and in the fact files.
- id: audit
  name: Audit
  price: 200
  price_label: $200 one time
  delivery: "Delivered in 3 to 5 business days"
  best_for: Stores and brands that want to know what AI tools can and cannot see.
  summary: A written report and a prioritized fix list, with no changes to your store.
  deliverables:
    - A written report of what AI tools can and cannot see
    - A prioritized fix list
    - A 30-minute call to walk through it
- id: fix
  name: Fix
  most_popular: true
  price: 600
  price_label: $600 one time
  delivery: "Delivered in 7 to 10 business days"
  best_for: Stores and brands that want the problems fixed.
  summary: The audit, then the fixes, done with your approval.
  deliverables:
    - Everything in Audit
    - AI crawler rules in robots.txt
    - Structured data for products or your brand
    - Product or brand data cleanup (up to 50 products)
    - An llms.txt file
- id: complete
  name: Complete
  price: 1200
  price_label: $1,200 one time
  delivery: "Delivered in 10 to 14 business days"
  best_for: Stores and brands that want to see the change.
  summary: The fixes, plus a before-and-after test and follow-up.
  deliverables:
    - Everything in Fix
    - A before-and-after test on 20 buyer questions
    - FAQ content
    # DRAFT wording, confirm
    - "14 days of follow-up after the fixes: your questions by email, and corrections to any of my changes"
- id: monthly-monitor
  name: Monthly Monitor
  price: 250
  price_label: $250 per month
  delivery: "Report each month"
  unit: month
  optional: true
  best_for: Stores and brands that want ongoing checks.
  summary: A monthly re-test, a short report and small fixes.
  deliverables:
    - A monthly re-test of your buyer questions
    - A short report
    # DRAFT wording, confirm (about 5 hours a month in total, from the plan brief)
    - "Small fixes, such as updating product details, FAQs or structured data, within about 5 hours of work a month"
