# Services FAQ. Add entries as "- q:" / "a:" pairs; they render on /services/
# and are included in the FAQPage structured data automatically.
- q: Can you build a new product or MVP from an idea?
  a: Yes. I start with a written plan for the smallest version that proves the idea, then build it in small reviewed steps with tests, so it can grow into a full product.
- q: Can you work on a Rails app we already run in production?
  a: Yes. I read the code and tests first, work on branches with pull requests, and keep changes small enough for your team to review.
- q: How do you keep AI features safe when they use real data?
  a: The model only gets narrow tools with validated arguments, anything that writes needs approval, and decisions that must be repeatable stay in code. shop_mcp_server and product_geo_agent are working examples.
- q: Can you take over a Shopify app or integration someone else built?
  a: Yes. I start by reading the code and checking how it uses the Shopify APIs and webhooks, then fix or extend it.
- q: Are you available as a full-time remote engineer?
  a: Yes. I am open to remote full-time roles as well as contracts and project work.
- q: How much do you charge?
  a: Hourly work is $45 to $60. Fixed-scope projects are quoted after a written plan, and monthly contract rates are available on request.
