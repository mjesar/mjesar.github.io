# Services FAQ. Add entries as "- q:" / "a:" pairs; they render on /services/
# and are included in the FAQPage structured data automatically.
- q: "Can you build a new product or MVP from an idea?"
  a: "Yes. I help turn an idea into a working MVP by defining the core problem, agreeing on the smallest useful feature set, and building it in small, tested steps."
- q: "Can you work on a Rails app we already run in production?"
  a: "Yes. I start by understanding the existing codebase, tests and application behavior. Then I make small, tested changes through branches and pull requests so your team can review them."
- q: "How do you keep AI features safe when they use real data?"
  a: "Each AI feature gets validated tool inputs, permission checks, and access to only the data and actions it needs. Write actions can require a person's approval based on your requirements, and important business rules stay in application code instead of relying on the model alone."
- q: "Can you automate business workflows?"
  a: "Yes. I automate repetitive business processes, such as order handling, data entry, support triage and reporting, either in n8n or directly in Rails with background jobs, scheduled tasks and webhooks. Steps that need judgment can use AI or wait for a person's approval, and complex business rules stay in tested Rails code."
- q: "Do you work in agile teams?"
  a: "Yes. I have worked in agile teams throughout my career, taking part in sprint planning and backlog grooming, defining project scope and estimating each task, and delivering work in small, reviewable pull requests. On freelance projects I use the same approach in short iterations, so you see working software early and can change priorities as you learn."
- q: "Can you take over a Shopify app or integration someone else built?"
  a: "Yes. I review the existing code, API usage, access scopes and webhooks before making changes. From there, I can fix issues, improve reliability or extend the app with tested, reviewable changes."
- q: "Are you available for full-time remote work?"
  a: "Yes. I am open to full-time remote engineering roles, contracts and freelance projects, and I work with teams across U.S. and European time zones."
- q: "How much do you charge?"
  a: "Hourly work is $45 to $60 per hour. A project has a fixed price, from $400. A monthly contract is $3,000 to $4,000 for part-time (20 hours a week) or $5,000 to $7,000 for full-time (40 hours a week)."
