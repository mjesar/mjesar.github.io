# Services FAQ. Add entries as "- q:" / "a:" pairs; they render on /services/
# and are included in the FAQPage structured data automatically.
- q: "Can you build a new product or MVP from an idea?"
  a: "Yes. I help turn an idea into a working MVP by defining the core problem, agreeing on the smallest useful feature set, and building it in small, tested steps."
- q: "Can you work on a Rails app we already run in production?"
  a: "Yes. I start by understanding the existing codebase, tests and application behavior. Then I make small, tested changes through branches and pull requests so your team can review them."
- q: "How do you keep AI features safe when they use real data?"
  a: "Each AI feature gets validated tool inputs, permission checks, and access to only the data and actions it needs. The write actions you choose need a person's approval, and important business rules stay in application code instead of relying on the model alone."
- q: "Can you take over a Shopify app or integration someone else built?"
  a: "Yes. I review the existing code, API usage, access scopes and webhooks before making changes. From there, I can fix issues, improve reliability or extend the app with tested, reviewable changes."
- q: "Are you available for full-time remote work?"
  a: "Yes. I am open to full-time remote engineering roles, contracts and freelance projects, and I work with teams across U.S. and European time zones."
- q: "How much do you charge?"
  a: "My hourly rate is $45 to $60, depending on the work. For fixed-scope projects, I give a quote after we agree on the requirements and plan. Monthly contract rates are available on request."
