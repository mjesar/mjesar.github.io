<text x="60" y="500" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8a8540">AI AGENT (side panel)</text>
<rect x="196" y="514" width="196" height="50" rx="14" fill="#051230"/>
<text x="294" y="535" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#ffffff">Any waterproof boots</text>
<text x="294" y="553" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#ffffff">in size 42?</text>
<circle cx="176" cy="539" r="13" fill="#a2441b"/>
<text x="176" y="544" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">2</text>
<rect x="80" y="584" width="312" height="50" rx="10" fill="#fbf8f3" stroke="#8a8540" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="94" y="605" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#4a5470">AI model picks a tool:</text>
<text x="94" y="624" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#a2441b">search_products</text>
<circle cx="80" cy="584" r="13" fill="#a2441b"/>
<text x="80" y="589" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">3</text>
<rect x="80" y="650" width="312" height="50" rx="10" fill="#eef0dd" stroke="#8a8540" stroke-width="1.5"/>
<text x="94" y="671" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#4a5470">The page returns data:</text>
<text x="94" y="690" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#051230">2 boots found (JSON)</text>
<circle cx="80" cy="650" r="13" fill="#a2441b"/>
<text x="80" y="655" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">4</text>
<rect x="80" y="716" width="312" height="66" rx="14" fill="#ffffff" stroke="#051230" stroke-width="1.5"/>
<text x="96" y="740" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#051230">Yes, 2 pairs in size 42.</text>
<text x="96" y="760" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#051230">Here are both.</text>
<circle cx="80" cy="716" r="13" fill="#a2441b"/>
<text x="80" y="721" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">5</text>
