<circle cx="70" cy="268" r="13" fill="#a2441b"/>
<text x="70" y="273" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#ffffff">1</text>
<text x="90" y="274" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#051230">The page registers its tools</text>
<text x="90" y="293" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#4a5470">registerTool() on page load</text>
<rect x="66" y="312" width="180" height="34" rx="8" fill="#fbe1cf" stroke="#a2441b" stroke-width="2.5"/>
<text x="156.0" y="334" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#a2441b">search_products</text>
<rect x="66" y="356" width="120" height="34" rx="8" fill="#f2ece2" stroke="#051230" stroke-width="1.5"/>
<text x="126.0" y="378" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#051230">get_price</text>
<rect x="196" y="356" width="130" height="34" rx="8" fill="#f2ece2" stroke="#051230" stroke-width="1.5"/>
<text x="261.0" y="378" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#051230">add_to_cart</text>
<text x="66" y="420" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#051230">Each tool runs as the page's</text>
<text x="66" y="438" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#051230">own JavaScript.</text>
