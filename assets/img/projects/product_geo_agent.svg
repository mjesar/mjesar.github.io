<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 312" width="820" height="312" role="img">
<title>product_geo_agent loop</title>
<rect x="1" y="1" width="818" height="310" rx="14" fill="#fbf8f3" stroke="#e0d7c8" stroke-width="2"/>
<text x="40" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#9a4413" letter-spacing="1">PRODUCT_GEO_AGENT LOOP</text>
<rect x="296" y="52" width="508" height="244" rx="12" fill="none" stroke="#8a8540" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="3 5" stroke-linecap="round"/>
<text x="790" y="38" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8a8540" letter-spacing="1">AGENT LOOP</text>
<rect x="40" y="64" width="190" height="76" rx="10" fill="#f2ece2" stroke="#051230" stroke-width="2"/>
<rect x="45" y="69" width="180" height="66" rx="7" fill="none" stroke="#a2441b" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="135" y="95" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#051230">1. Context</text>
<text x="135" y="119" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#4a5470">one Shopify product</text>
<rect x="315" y="64" width="190" height="76" rx="10" fill="#f2ece2" stroke="#051230" stroke-width="2"/>
<rect x="320" y="69" width="180" height="66" rx="7" fill="none" stroke="#a2441b" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="410" y="95" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#051230">2. Reason</text>
<text x="410" y="119" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#4a5470">Gemini picks the next tool</text>
<rect x="600" y="64" width="190" height="76" rx="10" fill="#f2ece2" stroke="#051230" stroke-width="2"/>
<rect x="605" y="69" width="180" height="66" rx="7" fill="none" stroke="#a2441b" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="695" y="95" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#051230">3. Act</text>
<text x="695" y="119" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#4a5470">one of five tools</text>
<rect x="600" y="208" width="190" height="76" rx="10" fill="#f2ece2" stroke="#051230" stroke-width="2"/>
<rect x="605" y="213" width="180" height="66" rx="7" fill="none" stroke="#a2441b" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="695" y="239" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#051230">4. Observe</text>
<text x="695" y="263" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#4a5470">reads the tool result</text>
<rect x="40" y="208" width="190" height="76" rx="10" fill="#f2ece2" stroke="#a2441b" stroke-width="2"/>
<rect x="45" y="213" width="180" height="66" rx="7" fill="none" stroke="#a2441b" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="135" y="239" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#a2441b">6. Answer</text>
<text x="135" y="263" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#4a5470">Ruby computes the score</text>
<path d="M232 102 H302" fill="none" stroke="#051230" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M314 102 L303 96 L303 108 z" fill="#051230"/>
<path d="M507 102 H587" fill="none" stroke="#051230" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M599 102 L588 96 L588 108 z" fill="#051230"/>
<path d="M695 142 V195" fill="none" stroke="#051230" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M695 207 L689 196 L701 196 z" fill="#051230"/>
<path d="M598 246 H430 V156" fill="none" stroke="#a2441b" stroke-width="2.5" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M430 141 L424 152 L436 152 z" fill="#a2441b"/>
<text x="514" y="236" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#a2441b">5. Repeat</text>
<text x="508" y="272" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#4a5470">until the checks are done</text>
<path d="M360 142 V246 H244" fill="none" stroke="#051230" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M232 246 L243 240 L243 252 z" fill="#051230"/>
<text x="368" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4a5470">done</text>
</svg>
