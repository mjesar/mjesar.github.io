<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 312" width="820" height="312" role="img">
<title>ai_shop_assistant message flow</title>
<rect x="1" y="1" width="818" height="310" rx="14" fill="#fbf8f3" stroke="#e0d7c8" stroke-width="2"/>
<text x="40" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#9a4413" letter-spacing="1">AI_SHOP_ASSISTANT MESSAGE FLOW</text>
<rect x="40" y="64" width="210" height="76" rx="10" fill="#f2ece2" stroke="#051230" stroke-width="2"/>
<text x="145.0" y="95" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#051230">1. Browser</text>
<text x="145.0" y="119" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#4a5470">shopper sends a message</text>
<rect x="305" y="64" width="210" height="76" rx="10" fill="#f2ece2" stroke="#051230" stroke-width="2"/>
<text x="410.0" y="95" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#051230">2. Controller</text>
<text x="410.0" y="119" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#4a5470">saves it, enqueues a job</text>
<rect x="570" y="64" width="210" height="76" rx="10" fill="#f2ece2" stroke="#051230" stroke-width="2"/>
<text x="675.0" y="95" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#051230">3. Background job</text>
<text x="675.0" y="119" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#4a5470">Solid Queue</text>
<rect x="40" y="196" width="210" height="76" rx="10" fill="#f2ece2" stroke="#9a4413" stroke-width="2"/>
<text x="145.0" y="227" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#9a4413">4. Gemini</text>
<text x="145.0" y="251" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#4a5470">RubyLLM, decides to search</text>
<rect x="305" y="196" width="210" height="76" rx="10" fill="#f2ece2" stroke="#051230" stroke-width="2"/>
<text x="410.0" y="227" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#051230">5. SearchProducts</text>
<text x="410.0" y="251" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#4a5470">Shopify Catalog over MCP</text>
<rect x="570" y="196" width="210" height="76" rx="10" fill="#f2ece2" stroke="#051230" stroke-width="2"/>
<text x="675.0" y="227" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#051230">6. Turbo Stream</text>
<text x="675.0" y="251" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#4a5470">reply via Solid Cable</text>
