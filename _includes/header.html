<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Mohammad Ali Jesar, home">
      <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0b1c44"/><text x="32" y="43" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f68c50">MJ</text></svg>
      <span>Mohammad Ali Jesar</span>
    </a>
    <nav aria-label="Main">
      <ul class="nav">
        {%- assign nav = "Projects:/projects/,Services:/services/,Writing:/writing/,Resume:/resume/,Uses:/uses/,Now:/now/" | split: "," -%}
        {%- for item in nav -%}
        {%- assign parts = item | split: ":" -%}
        <li><a href="{{ parts[1] }}"{% if page.url contains parts[1] %} aria-current="page"{% endif %}>{{ parts[0] }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
  </div>
</header>
