<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Mohammad Ali Jesar, home">
      <img src="/assets/img/logo.svg" width="36" height="36" alt="" aria-hidden="true">
      <span>Mohammad Ali Jesar</span>
    </a>
    <nav aria-label="Main">
      <ul class="nav">
        {%- assign nav = "Projects:/projects/,Services:/services/,Writing:/writing/,Resume:/resume/,Uses:/uses/,Now:/now/" | split: "," -%}
        {%- for item in nav -%}
        {%- assign parts = item | split: ":" -%}
        <li><a href="{{ parts[1] }}"{% if page.url contains parts[1] %} aria-current="page"{% endif %}>{{ parts[0] }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch to dark theme" hidden>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
<script>
  (function () {
    var root = document.documentElement;
    var button = document.querySelector(".theme-toggle");
    var system = window.matchMedia("(prefers-color-scheme: dark)");

    function isDark() {
      var picked = root.getAttribute("data-theme");
      return picked ? picked === "dark" : system.matches;
    }

    function sync() {
      var dark = isDark();
      root.classList.toggle("is-dark", dark);
      button.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
    }

    button.hidden = false;
    button.addEventListener("click", function () {
      var next = isDark() ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
      sync();
    });
    if (system.addEventListener) system.addEventListener("change", sync);
    sync();
  })();
</script>
