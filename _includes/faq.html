{%- assign faqs = site.data.faq -%}
{%- if faqs and faqs.size > 0 %}
<h2 id="faq">Frequently asked questions</h2>
<dl class="faq">
{%- for item in faqs %}
  <dt>{{ item.q }}</dt>
  <dd>{{ item.a | markdownify | remove: '<p>' | remove: '</p>' }}</dd>
{%- endfor %}
</dl>
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{% for item in faqs %}{"@type":"Question","name":{{ item.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ item.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{% endfor %}]}
</script>
{%- endif %}
