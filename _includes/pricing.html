{%- assign rows = site.data.pricing -%}
{%- if rows and rows.size > 0 %}
<h2 id="pricing">Pricing</h2>
<p>All prices are in USD.</p>
<table>
  <thead><tr><th>Engagement</th><th>Price</th><th>Terms</th></tr></thead>
  <tbody>
  {%- for r in rows %}
    <tr>
      <td><strong>{{ r.name }}</strong></td>
      <td>{{ r.price }}</td>
      <td>{{ r.terms | markdownify | remove: '<p>' | remove: '</p>' | strip }}</td>
    </tr>
  {%- endfor %}
  </tbody>
</table>
{%- endif %}
