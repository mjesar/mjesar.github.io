# Builds the site with the Ruby version in .ruby-version and the Jekyll version in
# Gemfile.lock (Jekyll 4), tests it, and deploys it to
# GitHub Pages. Without this, GitHub Pages ignores the Gemfile and builds with its own
# Jekyll 3.10. Needs Settings > Pages > Source set to "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: actions/configure-pages@v5
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      # Checks the built site (JSON files, JSON-LD, WebMCP tools) and stops the deploy if
      # anything fails. Uses Node's built-in test runner, so there is nothing to install.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test 'test/*.test.mjs'
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
